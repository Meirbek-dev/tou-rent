# cargo-deny (гейт G13). Защищенный путь - правки только с аппрувом инженера (арх. § 8).

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
  # Публичное достояние де-факто: adler2 (0BSD) в дереве flate2
  "0BSD",
  "CC0-1.0",
]
# Крейты самого репозитория не публикуются и лицензии в манифесте не имеют
private = { ignore = true }

[advisories]
yanked = "deny"
# Транзитивные предупреждения без доступного исправления (T31, G13 в error).
# Каждая запись - решение инженера: почему принимаем и когда пересмотреть.
# Пересматривать при обновлении typst и openidconnect.
ignore = [
  # rsa 0.9: Marvin - тайминговый сайдканал операций с ЗАКРЫТЫМ ключом.
  # Приходит из openidconnect (FR-1502) и используется только для проверки
  # подписи id_token открытым ключом провайдера. Фикса в 0.9.x нет.
  "RUSTSEC-2023-0071",
  # quick-xml 0.38 (citationberg → hayagriva → typst-library): квадратичный
  # разбор дублей атрибутов и неограниченные namespace-объявления. XML
  # разбирается только внутри Typst при рендере НАШИХ печатных форм -
  # внешний XML в него не попадает. Версию диктует typst 0.15.
  "RUSTSEC-2026-0194",
  "RUSTSEC-2026-0195",
  # Неподдерживаемые крейты в дереве typst (syntect, шрифты) и paste:
  # уязвимостей нет, замены зависят от апстрима typst.
  "RUSTSEC-2025-0141", # bincode 1.x (syntect)
  "RUSTSEC-2024-0320", # yaml-rust (syntect)
  "RUSTSEC-2024-0436", # paste
  "RUSTSEC-2026-0206", # rustybuzz
  "RUSTSEC-2026-0192", # ttf-parser
]

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
