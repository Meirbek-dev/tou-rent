# Rust-workspace TOU.Rent (арх. § 4–5).
# Все крейты: edition 2024, forbid(unsafe_code), запрет паник/println в не-тестовом коде (G2).

[workspace]
resolver = "3"
members = [
  "apps/api",
  "apps/jobs",
  "crates/application",
  "crates/domain",
  "crates/db",
  "crates/http",
  "crates/ports",
  "crates/testkit",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
tou-domain = { path = "crates/domain" }
tou-application = { path = "crates/application" }
tou-db = { path = "crates/db" }
tou-http = { path = "crates/http" }
tou-ports = { path = "crates/ports" }
tou-testkit = { path = "crates/testkit" }

anyhow = "1.0.104" # только в bin-крейтах (арх. § 5)
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie"] }
jiff = { version = "0.2.35", features = ["serde"] }
rust_decimal = { version = "1.42.1", features = ["serde", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Фича "macros" (query!/G3 `sqlx prepare`) включена: запросы проверяются
# компилятором по живой схеме, а не `try_get` по строковому имени колонки.
# Сборка идет в контейнере (A-003), поэтому VS Build Tools на Windows-хосте
# больше не при чем. Для сборок без БД (образ, CI) служит offline-слепок
# `.sqlx` + SQLX_OFFLINE=true.
sqlx = { version = "=0.8.6", default-features = false, features = [
  "runtime-tokio",
  "macros",
  "postgres",
  "uuid",
  "rust_decimal",
  "migrate",
  "json",
  "time",
] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
# BroadcastStream - SSE-доставка уведомлений (FR-1301)
tokio-stream = { version = "0.1.19", features = ["sync"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["trace", "timeout", "cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
utoipa = { version = "5.5.0", features = ["axum_extras", "uuid", "decimal"] }
utoipa-axum = "0.2.0"
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
uuid = { version = "1.24.0", features = ["v7", "serde"] }

# --- Запинено заранее, крейты подключают через `workspace = true` ---
# Валидация домена (паритет с Valibot, FR-401)
garde = { version = "0.23.0", features = ["derive", "email", "url"] }
time = { version = "0.3.55", features = [
  "serde-well-known",
  "formatting",
  "macros",
] } # tower-sessions + timestamptz DTO + печатные формы (даты Asia/Almaty)
# Auth контура 1: Argon2id + сессии в Redis (FR-1501)
argon2 = "0.6.0-rc.8"
# 0.14: диктуется tower-sessions-redis-store 0.16 (tower-sessions-core 0.14)
tower-sessions = "=0.14.0"
tower-sessions-redis-store = "0.16.0"
# Шина реалтайма (T58, NFR-12): pub/sub поверх того же Redis, что и сессии.
# Прямая зависимость, а не реэкспорт из tower-sessions-redis-store: подписчику
# нужна фича subscriber-client, а версия обязана совпадать с той, что тянет
# хранилище сессий, — иначе типы клиента разъедутся
fred = { version = "10.1.0", features = ["subscriber-client"] }
# Obligations engine и отложенные задачи (FR-1701, INV-076)
apalis = "1.0.0-rc.9"
apalis-cron = "1.0.0-rc.8"
deadpool-redis = "0.23.0"
# Печатные формы PDF: объявление, протоколы, договор (Прил. 1–3, 5–12)
typst = "0.15.1"
typst-layout = "0.15.1" # PagedDocument не реэкспортируется из typst
typst-pdf = "0.15.1"
# Встроенные шрифты Libertinus (кириллица) - печать без файлов на диске
typst-assets = { version = "0.15.1", features = ["fonts"] }
# Типизация WS-сообщений аукциона для фронта (арх. § 7)
schemars = "1.2.2"
# Файлы в RustFS (S3 API): сканы заявок, PDF-протоколы (арх. § 2, ADR-0006)
object_store = { version = "0.14.1", features = ["aws"] }
# Выгрузка досье тендера архивом (FR-1602): только deflate, без шифрования
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
# Hash-цепочка аудита INV-A01 (паритет с sha256() в БД)
sha2 = "0.11.0"
rand = "0.10.2"
# Вход через внешнего провайдера идентичности (FR-1502, ADR-0003): OIDC
# authorization code + PKCE; rustls - без системного OpenSSL в образе
openidconnect = { version = "4.0.1", default-features = false, features = [
  "reqwest",
  "rustls-tls",
] }
# Тесты: golden (FR-201), property (FR-601), фикстуры БД (testkit)
insta = { version = "1.48.0", features = ["json", "redactions"] }
proptest = "1.11.0"
testcontainers-modules = { version = "0.15.0", features = [
  "postgres",
  "redis",
] }

[workspace.lints.rust]
unsafe_code = "forbid"

# G2: запрещенные вызовы - компилятор вместо ревьюера (арх. § 8).
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
disallowed_methods = "deny"
