# G2 (арх. § 8): запрещенные вызовы. В тестах паники разрешены.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-dbg-in-tests = true
allow-print-in-tests = true

# В перечне обязан быть каждый способ спросить часы процесса: пропущенный
# и есть тот, которым воспользуются. `time::OffsetDateTime::now_utc` был
# пропущен - через него пять печатных форм ставили отметку «сформировано»
# мимо `core.now()` и мимо сдвига часов стенда (ADR-0005).
disallowed-methods = [
  { path = "std::time::SystemTime::now", reason = "время - только через доменную абстракцию Clock либо core.now() из БД (регламент А.5, ADR-0005)" },
  { path = "jiff::Timestamp::now", reason = "время - только через доменную абстракцию Clock либо core.now() из БД (регламент А.5, ADR-0005)" },
  { path = "jiff::Zoned::now", reason = "время - только через доменную абстракцию Clock либо core.now() из БД (регламент А.5, ADR-0005)" },
  { path = "time::OffsetDateTime::now_utc", reason = "отметка времени - из БД (tou_db::refdata::now / core.now()), иначе она разъезжается со сдвигом часов стенда (ADR-0005)" },
]
# `OffsetDateTime::now_local` в перечень не добавлен: он живет за фичей
# `local-offset`, которая в дереве не включена, и clippy на недостижимый
# путь ругается предупреждением. Появится фича - появится и строка.
# `std::time::Instant::now` в перечень не входит намеренно: он измеряет
# длительность, а не называет момент. Метрики RED (`metrics.rs`) им и живут,
# и подделать отметку через него нельзя - монотонные часы не переводятся
# в дату вообще.
